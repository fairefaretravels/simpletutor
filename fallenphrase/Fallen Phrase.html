<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallen Phrase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#dce8f2;--panel:#fff;--ink:#16263a;--muted:#5b6f85;--accent:#e0573b;--good:#1f9d6b;--bar:#c4d4e4;--chip:#9be0c4;--edge:#16263a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--panel:#17283f;--ink:#eaf1f8;--muted:#8fa4bb;--accent:#ff7a5c;--good:#3ed598;--bar:#26405e;--chip:#5cc7a0;--edge:#0a1422}}
:root[data-theme="dark"]{--bg:#0e1a2b;--panel:#17283f;--ink:#eaf1f8;--muted:#8fa4bb;--accent:#ff7a5c;--good:#3ed598;--bar:#26405e;--chip:#5cc7a0;--edge:#0a1422}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{padding:12px 16px 4px;display:flex;justify-content:space-between;max-width:560px;width:100%;margin:0 auto}
.stat{font-size:15px;color:var(--muted)}.stat b{color:var(--ink);font-size:20px}
.phrase{max-width:560px;width:100%;margin:0 auto;text-align:center;padding:0 16px 10px}
#clue{font-size:48px;line-height:1.1}
#slots{display:flex;justify-content:center;gap:8px 10px;flex-wrap:wrap;margin-top:8px}
.slot{min-width:30px;height:34px;border-bottom:4px solid var(--ink);font-size:21px;font-weight:700;line-height:34px;padding:0 4px}
.slot.next{border-color:var(--accent)}
#field{position:relative;flex:1;max-width:560px;width:100%;margin:0 auto;overflow:hidden;background:var(--panel);border-radius:18px 18px 0 0}
#field.shake{animation:sh .35s}#field.win{animation:win .4s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes win{50%{background:color-mix(in srgb,var(--good) 25%,var(--panel))}}
.chip{position:absolute;top:0;left:0;padding:10px 18px;border-radius:999px;background:var(--chip);border:3px solid var(--edge);font-size:22px;font-weight:700;color:#16263a;white-space:nowrap;cursor:pointer;will-change:transform}
.pop{animation:pop .18s forwards;pointer-events:none}.bad{background:var(--accent)!important}
@keyframes pop{to{opacity:0;scale:1.4}}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:color-mix(in srgb,var(--panel) 92%,transparent);z-index:5}
#overlay h1{margin:0;font-size:34px}#overlay p{margin:0;max-width:310px;color:var(--muted);font-size:17px;line-height:1.4}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 22px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){#field.shake,#field.win{animation:none}}
</style>
</head>
<body>
<header>
  <div class="stat">Score<br><b id="score">0</b></div>
  <div class="stat" style="text-align:right">Lives<br><b id="lives">3</b></div>
</header>
<div class="phrase"><div id="clue"></div><div id="slots"></div></div>
<div id="field">
  <div id="overlay">
    <h1 id="ovTitle">Fallen Phrase</h1>
    <p id="ovText">Tap the falling words in the right order to build the sentence. The blanks show how long each word is. A wrong word costs a life.</p>
    <button id="startBtn">Play</button>
  </div>
</div>
<script>
(function(){
var SENT=[['The cat sat on the mat','🐱'],['I like to eat pizza','🍕'],['The sun is very hot','☀️'],['My dog can run fast','🐶'],['We play in the park','🛝'],['The bird sings a song','🐦'],['Rain falls from the clouds','🌧️'],['She reads a book at night','📚'],['The fish swims in the pond','🐟'],['He rides his bike to school','🚲'],['The rocket flew to the moon','🚀'],['We built a sandcastle at the beach','🏖️'],['A little turtle walked across the road','🐢'],['The brave knight fought the fierce dragon','🐉'],['Our team won the game last night','🏆'],['The farmer fed the hungry chickens at sunrise','🐔']];
var field=document.getElementById('field'),overlay=document.getElementById('overlay'),slots=document.getElementById('slots'),clue=document.getElementById('clue');
var S={words:[],i:0,n:0,lives:3,score:0,chips:[],run:false,last:0,sp:0};
var ALL=[];SENT.forEach(function(s){s[0].split(' ').forEach(function(w){ALL.push(w.toLowerCase());});});
function draw(){document.getElementById('score').textContent=S.score;document.getElementById('lives').textContent=S.lives;}
function newSent(){
  var s=SENT[Math.min(S.n,SENT.length-1)];if(S.n>=SENT.length)s=SENT[Math.floor(Math.random()*SENT.length)];
  S.words=s[0].split(' ');clue.textContent=s[1];S.i=0;slots.innerHTML='';
  S.words.forEach(function(w){var e=document.createElement('span');e.className='slot';e.style.minWidth=(w.length*12+12)+'px';slots.appendChild(e);});
  mark();
}
function mark(){Array.prototype.forEach.call(slots.children,function(s,k){s.classList.toggle('next',k===S.i);});}
function spawn(){
  var r=Math.random(),w;
  if(r<0.45)w=S.words[S.i];
  else if(r<0.8)w=S.words[Math.floor(Math.random()*S.words.length)];
  else w=ALL[Math.floor(Math.random()*ALL.length)];
  if(w===undefined)return;
  var d=document.createElement('div');d.className='chip';d.textContent=w;field.appendChild(d);
  var c={w:w,el:d,x:Math.random()*Math.max(0,field.clientWidth-d.offsetWidth),y:-60,vy:50+S.n*4+Math.random()*30};
  d.addEventListener('pointerdown',function(e){e.preventDefault();tap(c);});
  S.chips.push(c);
}
function remove(c,pop,bad){
  S.chips=S.chips.filter(function(k){return k!==c;});
  if(pop){c.el.classList.add('pop');if(bad)c.el.classList.add('bad');setTimeout(function(){c.el.remove();},200);}else c.el.remove();
}
function flash(cls){field.classList.remove('shake','win');void field.offsetWidth;field.classList.add(cls);}
function tap(c){
  if(!S.run||S.i<0)return;
  if(c.w.toLowerCase()===S.words[S.i].toLowerCase()){
    remove(c,true);var sl=slots.children[S.i];sl.textContent=S.words[S.i];sl.style.minWidth='0';S.i++;mark();
    if(S.i===S.words.length){S.score+=S.words.length*3;S.n++;S.i=-1;mark();flash('win');draw();setTimeout(function(){if(S.run)newSent();},700);}
  }else{
    remove(c,true,true);S.lives--;flash('shake');draw();if(S.lives<=0)end();
  }
}
function end(){
  S.run=false;
  document.getElementById('ovTitle').textContent='Game over';
  document.getElementById('ovText').textContent='You built '+S.n+' sentence'+(S.n===1?'':'s')+' and scored '+S.score+'.';
  document.getElementById('startBtn').textContent='Play again';overlay.classList.remove('hidden');
}
function start(){
  S.chips.forEach(function(c){c.el.remove();});S.chips=[];
  S.lives=3;S.score=0;S.n=0;draw();newSent();S.run=true;S.sp=0;S.last=performance.now();
  overlay.classList.add('hidden');requestAnimationFrame(loop);
}
function loop(now){
  if(!S.run)return;
  var dt=Math.min(0.05,(now-S.last)/1000);S.last=now;S.sp-=dt;
  if(S.sp<=0){if(S.i>=0)spawn();S.sp=Math.max(0.8,1.3-S.n*0.03);}
  var h=field.clientHeight;
  S.chips.slice().forEach(function(c){c.y+=c.vy*dt;c.el.style.transform='translate('+c.x+'px,'+c.y+'px)';if(c.y>h)remove(c,false);});
  requestAnimationFrame(loop);
}
document.getElementById('startBtn').onclick=start;
draw();
})();
</script>
</body>
</html>
